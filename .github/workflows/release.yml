name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without leading v (for example: 0.1.0-preview.1)'
        required: true
        default: '0.1.0-preview.1'
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout release baseline
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid version: $version"
          }

      - name: Restore
        run: dotnet restore .\ColmiRingVRCBridge.sln

      - name: Build Release
        run: dotnet build .\ColmiRingVRCBridge.sln -c Release --no-restore -p:Version=${{ inputs.version }}

      - name: Test Release
        run: dotnet test .\ColmiRingVRCBridge.sln -c Release --no-build --no-restore -p:Version=${{ inputs.version }}

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish .\src\ColmiRingVRCBridge\ColmiRingVRCBridge.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=${{ inputs.version }} `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\artifacts\publish\win-x64

      - name: Package and checksum
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $zipName = "ColmiRingVRCBridge-$version-win-x64.zip"
          $zipPath = Join-Path $PWD "artifacts\$zipName"

          Compress-Archive `
            -Path .\artifacts\publish\win-x64\* `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content "$zipPath.sha256" -NoNewline

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          $tag = "v$version"
          $zip = ".\artifacts\ColmiRingVRCBridge-$version-win-x64.zip"
          $checksum = "$zip.sha256"
          $notes = ".\docs\releases\$tag.md"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Refusing to overwrite an existing release."
          }

          $args = @(
            'release', 'create', $tag,
            $zip, $checksum,
            '--target', $env:GITHUB_SHA,
            '--title', $tag
          )

          if ('${{ inputs.prerelease }}' -eq 'true') {
            $args += '--prerelease'
          }

          if (Test-Path $notes) {
            $args += @('--notes-file', $notes)
          }
          else {
            $args += '--generate-notes'
          }

          & gh @args
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
