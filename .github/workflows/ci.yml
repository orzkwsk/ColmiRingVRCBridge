name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\ColmiRingVRCBridge.sln

      - name: Build Release
        run: dotnet build .\ColmiRingVRCBridge.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test .\ColmiRingVRCBridge.sln -c Release --no-build --no-restore

      - name: Restore win-x64 publish runtime
        run: dotnet restore .\src\ColmiRingVRCBridge\ColmiRingVRCBridge.csproj -r win-x64

      - name: Publish smoke test (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish .\src\ColmiRingVRCBridge\ColmiRingVRCBridge.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\artifacts\publish-smoke\win-x64
